services:
  db:
    image: postgres:17-alpine
    container_name: publiceventsplatform-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: public_events_platform
    volumes:
      - publiceventsplatform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d public_events_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  publiceventsplatform_pgdata:
